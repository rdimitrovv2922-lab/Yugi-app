<!DOCTYPE html>
<html lang="en">
<head>
    <title>Yugioh Game Board</title>
    <link rel="stylesheet" href="game-board.css">
</head>
<body>
    <div id="game-container" class="game-container">   

        <div class="game-container-left"> 
            <div id="turn-indicator">
                <span>Turn</span>
                <span id="turn-number">1</span>
            </div>
            
            <div id="phase-tracker">
                <div class="phase" data-phase="DP">DP</div>
                <div class="phase" data-phase="SP">SP</div>
                <div class="phase" data-phase="M1">M1</div>
                <div class="phase" data-phase="BP">BP</div>
                <div class="phase" data-phase="M2">M2</div>
                <div class="phase" data-phase="EP">EP</div>
            </div>

            <div class="player-info-box">
                <span class="player-name">Player</span>
                <span class="player-lp">8000 LP</span>     
            </div>
        </div>

        <div class="game-container-center">
            <div id="opponent-hand" class="hand-container">
            </div>

            <div id="opponent-field" class="field-container">
                <div class="left-zones">
                    <div class="deck-zone">
                        <div class="card-slot deck">
                            <button id="draw-btn-opponent">Draw Card</button>
                        </div>
                    </div>

                    <div class="graveyard-zone">
                        <div class="card-slot graveyard"></div>
                    </div>

                    <div class="banished-zone">
                        <div class="card-slot banished"></div>
                    </div>
                </div>
                
                <div class="middle-zones">
                    <div class="spell-zone">
                        <div class="card-slot pendulum-right"></div>
                        <div class="card-slot"></div>
                        <div class="card-slot"></div>
                        <div class="card-slot"></div>
                        <div class="card-slot pendulum-left"></div>
                    </div>

                    <div class="monster-zone">
                        <div class="monster-slot-wrapper"> 
                            <div id="opm1" class="card-slot" data-index="1"></div>
                            <div id="opm1-set" class="set-slot" data-index="1"></div>
                        </div>

                        <div class="monster-slot-wrapper">
                            <div id="opm2" class="card-slot" data-index="2"></div>
                            <div id="opm2-set" class="set-slot" data-index="2"></div>
                        </div>

                        <div class="monster-slot-wrapper"> 
                            <div id="opm3" class="card-slot" data-index="3"></div>
                            <div id="opm3-set" class="set-slot" data-index="3"></div>
                        </div>

                        <div class="monster-slot-wrapper"> 
                            <div id="opm4" class="card-slot" data-index="4"></div>
                            <div id="opm4-set" class="set-slot" data-index="4"></div>
                        </div>

                        <div class="monster-slot-wrapper"> 
                            <div id="opm5" class="card-slot" data-index="5"></div>
                            <div id="opm5-set" class="set-slot" data-index="5"></div>
                        </div>
                    </div>
                </div>   
                
                <div class="right-zones">
                    <div class="extra-deck-zone">
                        <div class="card-slot deck extra-deck"></div>
                    </div>

                    <div class="field-zone">
                        <div class="card-slot"></div>
                    </div>
                    
                    <div class="empty-zone">
                        <div class="card-slot invisible"></div>
                    </div>
                </div>     
            </div>

            <div id="extra-monster-zone" class="extra-monster-zone">
                <div class="monster-slot-wrapper invisible"></div>

                <div class="monster-slot-wrapper">
                    <div id="m6" class="card-slot" data-index="6"></div>
                    <div id="m6-set" class="set-slot" data-index="6"></div>
                </div>

                <div class="monster-slot-wrapper invisible"></div>

                <div class="monster-slot-wrapper"> 
                    <div id="m7" class="card-slot" data-index="7"></div>
                    <div id="m7-set" class="set-slot" data-index="7"></div>
                </div>

                <div class="monster-slot-wrapper invisible"></div>
            </div>

            <div id="player-field" class="field-container">
                <div class="left-zones">
                    <div class="empty-zone">
                        <div class="card-slot invisible"></div>
                    </div>

                    <div class="field-zone">
                        <div id="s6" class="card-slot" data-index="6"></div>
                    </div>
                    
                    <div class="extra-deck-zone">
                        <div id="extradeck" class="card-slot deck extra-deck"></div>
                    </div>
                </div>

                <div class="middle-zones">
                    <div id="player-monster-zone" class="monster-zone">
                        <div class="monster-slot-wrapper"> 
                            <div id="m1" class="card-slot" data-index="1"></div>
                            <div id="m1-set" class="set-slot" data-index="1"></div>
                        </div>

                        <div class="monster-slot-wrapper">
                            <div id="m2" class="card-slot" data-index="2"></div>
                            <div id="m2-set" class="set-slot" data-index="2"></div>
                        </div>

                        <div class="monster-slot-wrapper"> 
                            <div id="m3" class="card-slot" data-index="3"></div>
                            <div id="m3-set" class="set-slot" data-index="3"></div>
                        </div>

                        <div class="monster-slot-wrapper"> 
                            <div id="m4" class="card-slot" data-index="4"></div>
                            <div id="m4-set" class="set-slot" data-index="4"></div>
                        </div>

                        <div class="monster-slot-wrapper"> 
                            <div id="m5" class="card-slot" data-index="5"></div>
                            <div id="m5-set" class="set-slot" data-index="5"></div>
                        </div>
                    </div>

                    <div id="player-spell-zone" class="spell-zone">
                        <div id="s1" class="card-slot pendulum-left" data-index="1"></div>
                        <div id="s2" class="card-slot" data-index="2"></div>
                        <div id="s3" class="card-slot" data-index="3"></div>
                        <div id="s4" class="card-slot" data-index="4"></div>
                        <div id="s5" class="card-slot pendulum-right" data-index="5"></div>
                    </div>
                </div>

                <div class="right-zones">
                    <div class="banished-zone">
                        <div id="banish" class="card-slot banished"></div>
                    </div>
                    
                    <div class="graveyard-zone">
                        <div id="graveyard" class="card-slot graveyard"></div>
                    </div>

                    <div class="deck-zone">
                        <div id="deck" class="card-slot deck">
                            <button id="draw-btn-player">Draw Card</button>
                        </div>
                    </div>
                </div>
            </div>

            <div id="player-hand" class="hand-container">
            </div>

        </div>

        <div class="game-container-right">
            <div class="player-info-box">
                <span class="player-name">Oponent</span>
                <span class="player-lp">8000 LP</span>
            </div> 
        </div>

    </div>
    
    <div id="window" class="window hidden">
        <div id="window-identifier">Graveyard</div>
        <div id="window-container" class="window-container">
        </div>
    </div>
    
    <div id="dropbox" class="dropbox hidden">
        <div id="monster" class="dropbox-item hidden" data-action="monster">Monster</div>
        <div id="spell-trap" class="dropbox-item hidden" data-action="spell-trap">Spell/Trap</div>
        <div id="activate" class="dropbox-item hidden" data-action="activate">Activate</div>
        <div id="send" class="dropbox-item hidden" data-action="send">Send to</div>
        <div id="move" class="dropbox-item hidden" data-action="move">Move</div>
        <div id="switch" class="dropbox-item hidden" data-action="switch">Switch Position</div>
        <div id="flip" class="dropbox-item" data-action="flip">Flip</div>
    </div>

    <div id="dropbox-monster" class="dropbox hidden">
        <div class="dropbox-item" data-action="normal-summon">Summon</div>
        <div class="dropbox-item" data-action="set">Set</div>
        <div class="dropbox-item" data-action="special-summon-atk">S. Summon Atk</div>
        <div class="dropbox-item" data-action="special-summon-def">S. Summon Def</div>
    </div>

    <div id="dropbox-spell-trap" class="dropbox hidden">
        <div class="dropbox-item" data-action="activate">Activate</div>
        <div class="dropbox-item" data-action="set">Set</div>
    </div>

    <div id="dropbox-send-to" class="dropbox hidden">
        <div class="dropbox-item" data-action="graveyard">To GY</div>
        <div class="dropbox-item" data-action="banish">To Banish</div>
        <div class="dropbox-item" data-action="hand">To Hand</div>
        <div class="dropbox-item" data-action="deck">To Deck</div>
        <div class="dropbox-item" data-action="extradeck">To Ex. Deck</div>
    </div>

    <div id="dropbox-switch-position" class="dropbox hidden">
        <div class="dropbox-item" data-action="to-atk">Switch to Atk</div>
        <div class="dropbox-item" data-action="to-def">Switch to Def</div>
        <div class="dropbox-item" data-action="to-set">Switch to Set</div>
    </div>
<script type="module" src="js/main.js"></script>    
</body>
</html>
